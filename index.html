  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ==========================================
    // 0. 安全相容 Polyfill
    // ==========================================
    if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
        if (!radii) radii = 0;
        let r0 = 0, r1 = 0, r2 = 0, r3 = 0;
        if (typeof radii === 'number') {
          r0 = r1 = r2 = r3 = radii;
        } else if (Array.isArray(radii)) {
          r0 = radii[0] || 0;
          r1 = radii[1] || r0;
          r2 = radii[2] || r0;
          r3 = radii[3] || r1;
        }
        this.beginPath();
        this.moveTo(x + r0, y);
        this.lineTo(x + w - r1, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r1);
        this.lineTo(x + w, y + h - r2);
        this.quadraticCurveTo(x + w, y + h, x + w - r2, y + h);
        this.lineTo(x + r3, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r3);
        this.lineTo(x, y + r0);
        this.quadraticCurveTo(x, y, x + r0, y);
        this.closePath();
        return this;
      };
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.warn("DeskBeat ErrorBoundary caught:", error, errorInfo);
      }
      resetError = () => {
        this.setState({ hasError: false, error: null });
      };
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center text-slate-cozy">
              <div className="bg-sand-card p-6 rounded-3xl border-2 border-amber-pastel/50 max-w-sm shadow-2xl">
                <div className="w-10 h-10 rounded-full bg-amber-soft text-amber-pastel flex items-center justify-center mx-auto mb-2 font-bold text-lg">!</div>
                <h3 className="text-lg font-black mb-1">畫面保護重設</h3>
                <p className="text-xs text-slate-muted mb-3">系統已自動防護，點擊按鈕即可繼續！</p>
                <button onClick={this.resetError} className="px-5 py-2 rounded-xl bg-matcha text-white font-bold text-xs shadow">繼續體驗</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ==========================================
    // 1. 純向量 SVG 圖示元件
    // ==========================================
    const Icon = ({ name, className = "w-3.5 h-3.5", ...props }) => {

              <circle cx="12" cy="13" r="3"/>

          );
        case 'play':
          return <svg className={className} viewBox="0 0 24 24" fill="currentColor" {...props}><polygon points="5 3 19 12 5 21 5 3"/></svg>;
        case 'pause':

        case 'volume-2':

                case 'globe':
          return (

          return (

            </svg>
          );
        case 'check':

        case 'mic':

              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>
            </svg>
          );
        case 'flame':
          return <svg className={className} viewBox="0 0 24 24" fill="currentColor" {...props}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>;
        case 'target':
          return (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
              <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
            </svg>
          );
        default:
          return <span>●</span>;
      }
    };

    const speakCoachPrompt = (text) => {
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = 'zh-TW';
          utter.rate = 1.05;
          utter.pitch = 1.0;
          window.speechSynthesis.speak(utter);
        }
      } catch (e) {}
    };

    // ==========================================
    // 2. LO-FI 爵士程序化音樂引擎 (60 / 75 / 88 BPM)
    // ==========================================
    class LoFiAudioEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.isMuted = false;
        this.bpm = 75;
        this.isPlaying = false;
        this.isPaused = false;
        this.currentStep = 0;
        this.timerId = null;
        this.volume = 0.65;
        this.noiseNode = null;
      }

      init() {
        try {
          if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            this.ctx = new AudioContext();

            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.setValueAtTime(this.volume, this.ctx.currentTime);

            this.masterFilter = this.ctx.createBiquadFilter();
            this.masterFilter.type = 'lowpass';
            this.masterFilter.frequency.setValueAtTime(3600, this.ctx.currentTime);

            this.compressor = this.ctx.createDynamicsCompressor();
            this.compressor.threshold.setValueAtTime(-18, this.ctx.currentTime);

            this.masterGain.connect(this.masterFilter);
            this.masterFilter.connect(this.compressor);
            this.compressor.connect(this.ctx.destination);

            this.startVinylNoise();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
        } catch (e) {}
      }

      setBpm(newBpm) {
        this.bpm = newBpm;
        if (this.isPlaying && !this.isPaused) {
          this.scheduleBeatLoop();
        }
      }

      toggleMute() {
        this.isMuted = !this.isMuted;
        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setValueAtTime(this.isMuted ? 0 : this.volume, this.ctx.currentTime);
        }
        return this.isMuted;
      }

      startVinylNoise() {
        if (!this.ctx || this.noiseNode) return;
        try {
          const bufferSize = this.ctx.sampleRate * 2;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);

          let b0 = 0, b1 = 0, b2 = 0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555;
            b1 = 0.99332 * b1 + white * 0.0750;
            b2 = 0.96900 * b2 + white * 0.1538;
            let pink = b0 + b1 + b2 + white * 0.536;
            if (Math.random() < 0.001) pink += (Math.random() * 2 - 1) * 3.0;
            data[i] = pink * 0.007;
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          noise.loop = true;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(1400, this.ctx.currentTime);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.22, this.ctx.currentTime);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterGain);

          noise.start();
          this.noiseNode = noise;
        } catch (e) {}
      }

      playKick(time) {
        if (!this.ctx) return;
        try {
          const t = time || this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.frequency.setValueAtTime(110, t);
          osc.frequency.exponentialRampToValueAtTime(42, t + 0.12);
          gain.gain.setValueAtTime(0.75, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(t);
          osc.stop(t + 0.3);
        } catch (e) {}
      }

      playSnare(time) {
        if (!this.ctx) return;
        try {
          const t = time || this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const oscGain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(180, t);
          osc.frequency.exponentialRampToValueAtTime(90, t + 0.08);
          oscGain.gain.setValueAtTime(0.4, t);
          oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
          osc.connect(oscGain);
          oscGain.connect(this.masterGain);

          const bufferSize = this.ctx.sampleRate * 0.12;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(2200, t);

          const noiseGain = this.ctx.createGain();
          noiseGain.gain.setValueAtTime(0.3, t);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);

          noise.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(this.masterGain);

          osc.start(t);
          osc.stop(t + 0.16);
          noise.start(t);
          noise.stop(t + 0.16);
        } catch (e) {}
      }

      playHiHat(time, accent = false) {
        if (!this.ctx) return;
        try {
          const t = time || this.ctx.currentTime;
          const bufferSize = this.ctx.sampleRate * 0.05;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(7500, t);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(accent ? 0.25 : 0.12, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.045);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterGain);

          noise.start(t);
          noise.stop(t + 0.05);
        } catch (e) {}
      }

      playChord(notes, time, duration = 2.4) {
        if (!this.ctx) return;
        try {
          const t = time || this.ctx.currentTime;
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t + idx * 0.025);

            const noteGain = 0.16 / notes.length;
            gain.gain.setValueAtTime(0.001, t + idx * 0.025);
            gain.linearRampToValueAtTime(noteGain, t + idx * 0.025 + 0.04);
            gain.exponentialRampToValueAtTime(0.0001, t + idx * 0.025 + duration);

            osc.connect(gain);
            gain.connect(this.masterGain);

            osc.start(t + idx * 0.025);
            osc.stop(t + idx * 0.025 + duration);
          });
        } catch (e) {}
      }

      playHitChime(rating = 'PERFECT') {
        if (!this.ctx || this.isMuted) return;
        try {
          const t = this.ctx.currentTime;
          let freq1 = 880;
          if (rating === 'SUPER') freq1 = 1318.51;
          else if (rating === 'PERFECT') freq1 = 1046.50;
          else if (rating === 'GREAT') freq1 = 880;

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq1, t);
          gain.gain.setValueAtTime(0.2, t);
          gain.exponentialRampToValueAtTime(0.001, t + 0.5);

          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(t);
          osc.stop(t + 0.5);
        } catch (e) {}
      }

      playVictoryFanfare() {
        if (!this.ctx) return;
        try {
          const notes = [587.33, 739.99, 880.00, 1174.66];
          notes.forEach((freq, idx) => {
            setTimeout(() => {
              if (this.ctx) {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.8);
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.8);
              }
            }, idx * 160);
          });
        } catch (e) {}
      }

      startSession(bpm = 75) {
        this.init();
        this.bpm = bpm;
        this.isPlaying = true;
        this.isPaused = false;
        this.currentStep = 0;
        this.scheduleBeatLoop();
      }

      scheduleBeatLoop() {
        if (this.timerId) clearInterval(this.timerId);
        const beatDuration = 60 / this.bpm;
        const stepTime = (beatDuration / 2) * 1000;

        const chords = [
          [146.83, 293.66, 369.99, 440.00, 554.37], // Dmaj9
          [123.47, 246.94, 369.99, 440.00, 587.33], // Bm7
          [164.81, 329.63, 392.00, 493.88, 587.33], // Em9
          [110.00, 220.00, 392.00, 493.88, 587.33]  // A7sus4
        ];

        this.timerId = setInterval(() => {
          if (!this.isPlaying || this.isPaused) return;
          const step = this.currentStep % 32;
          const barIdx = Math.floor(step / 8);
          const isEighth = (step % 2) === 1;

          this.playHiHat(this.ctx.currentTime, !isEighth);

          if (step % 8 === 0 || step % 8 === 5) {
            this.playKick(this.ctx.currentTime);
          }
          if (step % 8 === 2 || step % 8 === 6) {
            this.playSnare(this.ctx.currentTime);
          }
          if (step % 8 === 0) {
            this.playChord(chords[barIdx], this.ctx.currentTime, 3.0);
          }

          this.currentStep++;
        }, stepTime);
      }

      pauseSession() {
        this.isPaused = true;
        if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }
      }

      resumeSession() {
        if (!this.isPlaying) return;
        this.isPaused = false;
        this.scheduleBeatLoop();
      }

      stopSession() {
        this.isPlaying = false;
        this.isPaused = false;
        if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }
      }
    }

    const audioSynth = new LoFiAudioEngine();

    // ==========================================
    // 2.5 多國語言字典 (繁體中文 / English) & 使用者語言跟蹤
    // ==========================================
    const I18N = {
      zh: {
        title: 'DeskBeat: 60秒辦公室工學節奏遊戲',
        subtitle: '動動肩頸、放鬆眼周・上班摸魚也能做工學復健',
        easy: '低速舒壓',
        medium: '中速推薦',
        hard: '高速挑戰⚡',

      const renderARLoop = (now) => {

          // 1. 動態同步畫布實體像素 (徹底消除束屏/豎屏長寬非等比擠壓失真)

              const lY = curPosture.eyeL.y * ch;

              const len = Math.hypot(vX, vY) || 1;

              ctx.moveTo(midX - ux * 130, midY - uy * 130);

              ctx.lineWidth = 2;
              ctx.setLineDash([4, 4]);
              ctx.beginPath();
              ctx.moveTo(midX - (-uy) * 55, midY - ux * 55);
              ctx.lineTo(midX + (-uy) * 55, midY + ux * 55);

          }

          // 2. 三軌下落軌道
          const trackWidth = cw / 3;
          const hitLineY = ch * hitRatio;

          const trackThemes = [
            { name: '眼睛', color: '#6AB04C', icon: '👁️', glow: 'rgba(106, 176, 76, 0.22)' },
            { name: '頸椎', color: '#FFA502', icon: '📐', glow: 'rgba(255, 165, 2, 0.22)' },

          ctx.beginPath();

          ctx.lineTo(cw, hitLineY);
          ctx.stroke();

          // 判定鎖定圓圈
          // 判定鎖定圓圈 (在任何裝置上均為 100% 正圓，絕不拉伸為垂直長橢圓)
          const hitRadius = Math.round(Math.min(26, trackWidth * 0.22));
          trackThemes.forEach((t, i) => {
            const cx = i * trackWidth + trackWidth / 2;
            let isEngaged = false;
            if (i === 0 && curPosture.eyes !== 'center') isEngaged = true;
            if (i === 1 && curPosture.neckState !== 'center') isEngaged = true;
            if (i === 2 && curPosture.shoulderState === 'shrug') isEngaged = true;

            ctx.beginPath();
            ctx.arc(cx, hitLineY, hitRadius, 0, Math.PI * 2);
            ctx.fillStyle = isEngaged ? t.color : 'rgba(255, 255, 255, 0.25)';
            ctx.fill();
            ctx.strokeStyle = isEngaged ? '#FFFFFF' : t.color;
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.fillStyle = '#FFFFFF';
            ctx.font = `bold ${Math.round(hitRadius * 0.6)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(t.icon, cx, hitLineY);
          });

          // 音符下落與判定
          if (gameState === 'playing' && !isPausedRef.current) {
            if (!gameStartTimeRef.current) gameStartTimeRef.current = now;
            const elapsed = (now - gameStartTimeRef.current - totalPausedDurationRef.current) / 1000;
            const timeLeft = Math.max(0, 60 - elapsed);
            setSessionTime(Math.ceil(timeLeft));

            if (timeLeft <= 0) {
              finishGame();
              return;
            }

            const speed = hitLineY / travelTime;

            notesRef.current.forEach(note => {
              if (note.hit) return;

              const noteY = hitLineY - (note.time - elapsed) * speed;
              const cx = note.track * trackWidth + trackWidth / 2;
              const isAtHitLine = Math.abs(noteY - hitLineY) < 36;
              const timeDiff = Math.abs(elapsed - note.time);

              let isMatch = false;
              if (note.posture === 'eye-left' && curPosture.eyes === 'left') isMatch = true;
              if (note.posture === 'eye-right' && curPosture.eyes === 'right') isMatch = true;
              if (note.posture === 'eye-close' && curPosture.eyes === 'close') isMatch = true;
              if (note.posture === 'neck-left' && curPosture.neckState === 'left') isMatch = true;
              if (note.posture === 'neck-right' && curPosture.neckState === 'right') isMatch = true;
              if (note.posture === 'neck-center' && curPosture.neckState === 'center') isMatch = true;
              if (note.posture === 'shoulder-shrug' && curPosture.shoulderState === 'shrug') isMatch = true;
              if (note.posture === 'shoulder-drop' && curPosture.shoulderState === 'normal') isMatch = true;

              if (isAtHitLine && isMatch && !note.hit) {
                note.hit = true;
                const isSuper = !!note.compoundGroup;
                const rating = isSuper ? 'SUPER' : timeDiff <= 0.16 ? 'PERFECT' : 'GREAT';

                // 各難度基底得分：難(3.2x) > 中(1.8x) > 低(1.0x)
                const diffConfig = {
                  easy: { mult: 1.0, superPts: 300, perfPts: 200, greatPts: 100, comboScale: 5 },
                  medium: { mult: 1.8, superPts: 550, perfPts: 380, greatPts: 200, comboScale: 15 },
                  hard: { mult: 3.2, superPts: 900, perfPts: 620, greatPts: 320, comboScale: 35 }
                };
                const cfg = diffConfig[difficulty] || diffConfig.medium;
                const basePts = isSuper ? cfg.superPts : rating === 'PERFECT' ? cfg.perfPts : cfg.greatPts;
                const comboBonus = Math.min(250, (combo + 1) * cfg.comboScale);
                const pts = Math.round((basePts + comboBonus) * cfg.mult);

                setScore(s => s + pts);
                setCombo(c => {
                  const n = c + 1;
                  setMaxCombo(m => Math.max(m, n));
                  return n;
                });

                setGameStats(prev => {
                  const next = { ...prev, totalHits: prev.totalHits + 1 };
                  if (note.track === 0) next.eyeHits++;
                  else if (note.track === 1) next.neckHits++;
                  else if (note.track === 2) next.shoulderHits++;
                  if (rating === 'SUPER') next.supers++;
                  else if (rating === 'PERFECT') next.perfects++;
                  else if (rating === 'GREAT') next.greats++;
                  return next;
                });

                const superMsg = lang === 'en' ? '✨ SUPER COMBO!' : '✨ 雙合拍 SUPER!';
                const perfMsg = lang === 'en' ? '✨ PERFECT!' : '✨ PERFECT 完美!';
                const greatMsg = lang === 'en' ? '🌿 GREAT!' : '🌿 GREAT 很好!';
                triggerJudgment(isSuper ? superMsg : rating === 'PERFECT' ? perfMsg : greatMsg, rating, note.track);
                audioSynth.playHitChime(rating);
                spawnParticles(cx, hitLineY, trackThemes[note.track].color);
              } else if (noteY > hitLineY + 45 && !note.hit) {
                note.hit = true;
                setCombo(0);
                triggerJudgment(lang === 'en' ? '❌ MISS' : '❌ MISS 漏失', 'MISS', note.track);
                setGameStats(prev => ({ ...prev, misses: prev.misses + 1 }));
              }

              if (noteY > -80 && noteY < ch + 60) {
                const color = trackThemes[note.track].color;
                // 自適應軌道寬度：在手機束屏下也能維持寬敞飽滿的膠囊寬度，告別窄扁壓迫感！
                const nw = Math.round(Math.min(trackWidth - 10, 180));
                const nh = Math.round(Math.max(34, Math.min(42, ch * 0.055)));
                const nx = cx - nw / 2;
                const ny = noteY - nh / 2;

                ctx.save();
                ctx.shadowColor = color;
                ctx.shadowBlur = 8;
                ctx.fillStyle = '#FFFFFF';

                if (note.track === 0) {
                  ctx.beginPath();
                  ctx.roundRect(nx, ny, nw, nh, 16);
                  ctx.fill();
                } else if (note.track === 1) {
                  const shear = note.posture === 'neck-left' ? -8 : 8;
                  ctx.beginPath();
                  ctx.moveTo(nx + (shear > 0 ? shear : 0), ny);
                  ctx.lineTo(nx + nw + (shear > 0 ? shear : 0), ny);
                  ctx.lineTo(nx + nw + (shear < 0 ? shear : 0), ny + nh);
                  ctx.lineTo(nx + (shear < 0 ? shear : 0), ny + nh);
                  ctx.closePath();
                  ctx.fill();
                } else {
                  ctx.beginPath();
                  ctx.roundRect(nx, ny, nw, nh, [4, 4, 14, 14]);
                  ctx.fill();
                }

                ctx.strokeStyle = color;
                ctx.lineWidth = 2.5;
                ctx.stroke();

                // 提示詞字體大小：自適應膠囊寬度與雙語字元！
                const displayLabel = getNoteLabel(note.label, lang);
                const charCount = (displayLabel && displayLabel.length) || 1;
                const fontPx = Math.round(Math.max(12, Math.min(15, (nw - 16) / (lang === 'en' ? charCount * 0.65 : charCount))));
                ctx.fillStyle = '#1E232A';
                ctx.font = `bold ${fontPx}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`${displayLabel}`, cx, noteY);
                ctx.restore();
              }
            });
          }

          // 粒子動畫
          hitEffectsRef.current.forEach((p, idx) => {
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.035;
            if (p.alpha <= 0) {
              hitEffectsRef.current.splice(idx, 1);
            } else {
              ctx.save();
              ctx.globalAlpha = p.alpha;
              ctx.fillStyle = p.color;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }
          });

          animId = requestAnimationFrame(renderARLoop);
        };

        animId = requestAnimationFrame(renderARLoop);
        return () => cancelAnimationFrame(animId);
      }, [gameState, difficulty]);

      const spawnParticles = (x, y, color) => {
        for (let i = 0; i < 10; i++) {
          hitEffectsRef.current.push({
            x: x + (Math.random() * 20 - 10),
            y: y + (Math.random() * 20 - 10),
            vx: (Math.random() * 6 - 3),
            vy: (Math.random() * -6 - 2),
            size: Math.random() * 3.5 + 2,
            color: color || '#FFA502',
            alpha: 1.0
          });
        }
      };

      const triggerJudgment = (text, rating, track) => {
        setJudgment({ text, rating, track, id: Date.now() + Math.random() });
      };

      // 7 動口令檢測
      useEffect(() => {
        if (gameState !== 'drill7') return;
        const curStep = SEVEN_DRILL_STEPS[drillIndex];
        if (curStep) speakCoachPrompt(curStep.voicePrompt);
        isDrillStepTransitioningRef.current = false;
      }, [gameState, drillIndex]);

      useEffect(() => {
        if (gameState !== 'drill7') return;
        if (drillIndex >= SEVEN_DRILL_STEPS.length) return;
        if (isDrillStepTransitioningRef.current) return;
        if (drillPassed[drillIndex]) return;

        const curStep = SEVEN_DRILL_STEPS[drillIndex];
        if (!curStep) return;

        if (curStep.checkFn(livePosture)) {
          isDrillStepTransitioningRef.current = true;
          audioSynth.playHitChime('PERFECT');

          setDrillPassed(prev => {
            const next = [...prev];
            next[drillIndex] = true;
            return next;
          });
          speakCoachPrompt("合格！");

          setTimeout(() => {
            setDrillIndex(cur => {
              if (cur < SEVEN_DRILL_STEPS.length - 1) return cur + 1;
              audioSynth.playVictoryFanfare();
              if (window.confetti) window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
              speakCoachPrompt("恭喜！七大動作全部合格驗收！");
              return cur;
            });
          }, 1100);
        }
      }, [gameState, drillIndex, livePosture.eyes, livePosture.neckState, livePosture.shoulderState, livePosture.shoulderElevation]);

      const togglePause = () => {
        if (isPaused) {
          if (pausedAtRef.current) totalPausedDurationRef.current += (performance.now() - pausedAtRef.current);
          audioSynth.resumeSession();
          setIsPaused(false);
        } else {
          pausedAtRef.current = performance.now();
          audioSynth.pauseSession();
          setIsPaused(true);
        }
      };

      const abortGame = () => {

        setIsPaused(false);
        setGameState('welcome');

      const finishGame = () => {

        <div className="w-full h-full flex items-center justify-center p-0 m-0 relative overflow-hidden bg-slate-dark">
          {/* ============================================================== */}

            <video

              className="absolute inset-0 w-full h-full object-cover transform -scale-x-100"

            {/* 護眼低對比半透明遮罩 */}
            <div className="absolute inset-0 bg-slate-dark/35 pointer-events-none" />

            {/* AR 動態參考軸與節奏下落畫布 */}
            <canvas
              ref={arCanvasRef}
              className="absolute inset-0 w-full h-full pointer-events-none"
            />

            {/* 頂部 HUD (避開動態島與瀏海) */}
            <div className="absolute top-2 left-3 right-3 safe-pad-x flex items-center justify-between text-xs z-20 pointer-events-none">
              <div className="flex items-center space-x-2 pointer-events-auto">
                <div className="px-3 py-1 rounded-full bg-slate-dark/85 backdrop-blur-md border border-white/15 text-white font-mono font-bold shadow-lg flex items-center space-x-2 text-[11px]">
                  <span>00:{sessionTime < 10 ? `0${sessionTime}` : sessionTime}</span>
                  <span className="text-white/30">•</span>
                  <span className="text-amber-pastel flex items-center space-x-0.5">
                    <Icon name="flame" className="w-3.5 h-3.5" />
                    <span>{combo}x</span>
                  </span>
                  <span className="text-white/30">•</span>
                  <span className="text-matcha-light">{score.toLocaleString()}</span>
                </div>

                <div className={`w-2.5 h-2.5 rounded-full ${livePosture.isFaceTracked ? 'bg-matcha' : 'bg-amber-pastel animate-pulse'}`}></div>
              </div>

              <div className="flex items-center space-x-1.5 pointer-events-auto">
                <button
                  onClick={toggleLang}
                  className="px-2 py-1 rounded-full bg-slate-dark/85 hover:bg-slate-cozy backdrop-blur-md border border-white/20 text-white font-bold text-[10px] flex items-center space-x-1 shadow-lg transition"
                  title="切換語言 / Switch Language"
                >
                  <Icon name="globe" className="w-3 h-3 text-matcha-light" />
                  <span>{lang === 'zh' ? 'EN' : '中文'}</span>
                </button>

                <div className="bg-slate-dark/85 backdrop-blur-md rounded-full border border-white/15 p-0.5 flex space-x-0.5 shadow-lg">
                  {['easy', 'medium', 'hard'].map(d => (
                    <button
                      key={d}
                      onClick={() => setDifficulty(d)}
                      className={`px-2 py-0.5 rounded-full text-[10px] font-bold transition ${
                        difficulty === d ? 'bg-matcha text-white' : 'text-white/60 hover:text-white'
                      }`}

                      {d === 'easy' ? '低' : d === 'medium' ? '中' : '高⚡'}
                    </button>
                  ))}
                </div>

                {gameState === 'playing' && (
                  <button
                    onClick={togglePause}
                    className="p-1.5 rounded-full bg-sand-card/25 backdrop-blur-md text-white font-bold hover:bg-sand-card/40 transition border border-white/20"

                    <Icon name={isPaused ? "play" : "pause"} className="w-3.5 h-3.5" />

                )}

                <button
                  onClick={() => { const m = audioSynth.toggleMute(); setIsMuted(m); }}
                  className="p-1.5 rounded-full bg-sand-card/25 backdrop-blur-md text-white hover:bg-sand-card/40 transition border border-white/20"
                >
                  <Icon name={isMuted ? "volume-x" : "volume-2"} className="w-3.5 h-3.5" />

            </div>

            {/* 醒目的立體發光打擊判定徽章 */}
            {judgment && (
              <div

                <div className={`px-4 py-1.5 rounded-2xl backdrop-blur-md border-2 shadow-2xl font-black text-sm sm:text-base tracking-wider flex items-center space-x-1.5 ${
                  judgment.rating === 'SUPER'

                    : judgment.rating === 'PERFECT'
                    ? 'bg-matcha/95 border-matcha-light text-white shadow-matcha/60'
                    : judgment.rating === 'GREAT'
                    ? 'bg-lake/95 border-lake-soft text-white shadow-lake/60'

              </div>
            )}

            {/* 底部控制膠囊 (桌機/橫屏維持單行、手機束屏優雅折為兩行，徹底杜絕文字垂直擠壓折行) */}

              <div className="flex items-center space-x-1.5 pointer-events-auto order-2 sm:order-1">
                <button

                >

                <button

              {/* 即時人體工學數值條 */}

                <span>
                  {t.eyes}: <strong className={livePosture.eyes !== 'center' ? 'text-matcha-light' : 'text-white'}>
                    {livePosture.eyes === 'left' ? t.lookLeft : livePosture.eyes === 'right' ? t.lookRight : livePosture.eyes === 'close' ? t.closeEyes : t.center}

                  {t.neck}: <strong className={livePosture.neckState !== 'center' ? 'text-amber-pastel' : 'text-white'}>
                    {livePosture.neckTilt}°{livePosture.neckState !== 'center' ? (livePosture.neckState === 'left' ? t.tiltLeft : t.tiltRight) : ''}
                  </strong>

                  </strong>

              </div>

              <div className="flex items-center space-x-1.5 pointer-events-auto order-3">
                <button
                  onClick={() => beginCalibrationFlow('drill7')}
                  className="px-3 py-1 rounded-full bg-amber-pastel hover:bg-amber-glow text-white font-bold shadow-lg flex items-center space-x-1 text-[11px] whitespace-nowrap transition"
                >

                {gameState === 'playing' && (

                  {/* 左欄：品牌標題與說明 */}

                    <div className="flex items-center space-x-1.5 px-2.5 py-0.5 rounded-full bg-amber-pastel/15 border border-amber-pastel/30 text-amber-pastel text-[10px] font-bold">
                      <span>{lang === 'en' ? '📱 Rotate phone or play vertical / Fullscreen' : '📱 支援手機直屏/橫屏全螢幕，開啟鏡頭即刻體驗'}</span>

                  {/* 右欄：難度選擇 ＋ 開始按鈕（水平並排收斂高度） */}

                    <div className="grid grid-cols-3 gap-1 w-full">
                      {['easy', 'medium', 'hard'].map(d => (
                        <button
                          key={d}

                          className={`py-1 rounded-lg text-[10px] font-bold transition border ${

                    >

            {/* 覆蓋層：3 秒倒數姿勢校準畫面 */}
            {gameState === 'calibrating' && (
              <div className="absolute inset-0 bg-slate-dark/80 backdrop-blur-sm z-30 flex flex-col items-center justify-center p-3 text-center text-white">
                <div className="relative w-20 h-20 flex items-center justify-center mb-2">
                  <div className="absolute inset-0 rounded-full border-4 border-matcha/40 animate-pulse-ring" />
                  <div className="w-14 h-14 rounded-full bg-matcha flex items-center justify-center shadow-xl">
                    <span className="text-2xl font-black font-mono text-white">{calibCountdown > 0 ? calibCountdown : '✓'}</span>
                  </div>
                </div>

                <h3 className="text-base font-black mb-0.5">
                  {calibCountdown > 0 ? '正在鎖定坐姿基準...' : '坐姿鎖定完成！'}
                </h3>
                <p className="text-[10px] text-white/80 max-w-xs leading-relaxed">
                  請放鬆雙肩、端正頭部、自然正視鏡頭。<br />系統將以此高度與角度作為 0 度與 0px 基準！
                </p>
              </div>
            )}

            {/* 覆蓋層：7 動口令檢測 */}
            {gameState === 'drill7' && (
              <div className="absolute inset-0 bg-slate-dark/80 backdrop-blur-sm z-30 flex items-center justify-center p-3 text-center text-white safe-pad-x">
                <div className="max-w-md w-full bg-slate-dark/95 p-3.5 rounded-2xl border border-amber-pastel/40 shadow-2xl flex flex-col gap-2">
                  <div className="flex justify-between items-center text-xs">
                    <span className="text-amber-pastel font-bold flex items-center space-x-1 text-[11px]">
                      <Icon name="mic" className="w-3.5 h-3.5" />
                      <span>動作檢測：{drillIndex + 1} / 7</span>
                    </span>
                    <button onClick={() => setGameState('welcome')} className="text-white/60 hover:text-white text-xs">離開</button>
                  </div>

                  <div className="flex gap-1">
                    {SEVEN_DRILL_STEPS.map((s, idx) => (
                      <div
                        key={s.id}
                        className={`h-1 flex-1 rounded-full transition-all ${
                          drillPassed[idx] ? 'bg-matcha' : drillIndex === idx ? 'bg-amber-pastel animate-pulse' : 'bg-white/20'
                        }`}
                      />
                    ))}
                  </div>

                  <div className="bg-white/10 rounded-xl p-2.5 text-left flex justify-between items-center">
                    <div>
                      <span className="text-[9px] text-amber-pastel uppercase font-bold">第 {drillIndex + 1} 動</span>
                      <h3 className="text-xs sm:text-sm font-black mt-0.5">{SEVEN_DRILL_STEPS[drillIndex]?.title}</h3>
                      <p className="text-[10px] text-white/70 mt-0.5">{SEVEN_DRILL_STEPS[drillIndex]?.targetDesc}</p>
                    </div>

                    <div className="text-right">
                      {drillPassed[drillIndex] ? (
                        <span className="text-xs font-black text-matcha-light flex items-center space-x-0.5">
                          <Icon name="check" className="w-3.5 h-3.5 text-matcha" />
                          <span>合格 PASS!</span>
                        </span>
                      ) : (
                        <span className="text-xs font-bold text-amber-pastel animate-pulse">檢測中...</span>
                      )}
                    </div>
                  </div>

                  <div className="flex justify-between items-center text-xs">
                    <button onClick={() => speakCoachPrompt(SEVEN_DRILL_STEPS[drillIndex]?.voicePrompt)} className="px-2.5 py-0.5 rounded-lg bg-white/15 text-[10px]">重聽口令</button>
                    {drillIndex < 6 && (
                      <button onClick={() => setDrillIndex(i => i + 1)} className="px-2.5 py-0.5 rounded-lg bg-white/15 text-[10px]">跳過此動</button>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* 覆蓋層：暫停視窗 */}
            {isPaused && (
              <div className="absolute inset-0 bg-slate-dark/80 backdrop-blur-sm z-30 flex flex-col items-center justify-center p-4 text-center text-white">
                <div className="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center mb-1.5">
                  <Icon name="pause" className="w-4 h-4 text-white" />
                </div>
                <h3 className="text-base font-black mb-1">伸展已暫停</h3>
                <p className="text-[11px] text-white/70 mb-2.5">點擊下方按鈕即可繼續</p>
                <div className="flex gap-2">
                  <button onClick={togglePause} className="px-4 py-1.5 rounded-xl bg-matcha hover:bg-matcha-dark text-white font-bold text-xs shadow">繼續遊戲</button>
                  <button onClick={abortGame} className="px-3 py-1.5 rounded-xl bg-white/20 hover:bg-white/30 text-white font-bold text-xs">結束回首頁</button>
                </div>
              </div>
            )}

            {/* 覆蓋層：精美結算成績卡與一鍵傳播分享 */}
            {gameState === 'victory' && (() => {
              const r = getRank();
              const totalChartNotes = (CHARTS[difficulty] || []).length || 1;
              const hitRate = Math.round(Math.min(100, (gameStats.totalHits / totalChartNotes) * 100));
              const diffName = difficulty === 'hard' ? t.hard : difficulty === 'medium' ? t.medium : t.easy;

              return (
                <div className="absolute inset-0 bg-slate-dark/90 backdrop-blur-md z-30 flex items-center justify-center p-2.5 sm:p-4 text-center text-white safe-pad-x overflow-y-auto">
                  <div className="max-w-md w-full bg-slate-dark/95 p-3.5 sm:p-5 rounded-3xl border border-white/20 shadow-2xl flex flex-col items-center relative my-auto">
                    {/* 卡片頂部徽章 */}
                    <div className="flex items-center space-x-1.5 mb-1">
                      <span className="px-2.5 py-0.5 rounded-full bg-matcha text-white text-[10px] font-bold shadow-md">
                        🏆 {t.victoryTag}
                      </span>
                      <span className="px-2 py-0.5 rounded-full bg-white/10 text-white/80 text-[10px] font-medium border border-white/10">
                        {diffName}
                      </span>
                    </div>

                    <h2 className="text-base sm:text-lg font-black mt-0.5 mb-0.5 tracking-wide">{t.victoryTitle}</h2>
                    <p className="text-[10px] sm:text-[11px] text-white/70 mb-2.5">{t.victorySub}</p>

                    {/* 成績核心卡片 (視覺化認證) */}
                    <div className={`w-full bg-gradient-to-br ${r.bg} rounded-2xl border ${r.border} p-3 mb-3 shadow-inner text-center relative overflow-hidden`}>
                      <div className="flex items-center justify-around">
                        {/* 評級 */}
                        <div className="flex flex-col items-center">
                          <span className="text-[10px] text-white/70 font-semibold">{t.overallRank}</span>
                          <span className={`text-4xl sm:text-5xl font-black ${r.color} drop-shadow-md leading-none my-0.5`}>
                            {r.rank}
                          </span>
                          <span className="text-[10px] font-bold text-white/90">{r.title}</span>
                        </div>

                        <div className="h-14 w-px bg-white/15" />

                        {/* 得分與連擊 */}
                        <div className="text-left flex flex-col justify-center space-y-0.5">
                          <div>
                            <span className="text-[9px] text-white/60 uppercase font-semibold">{t.finalScore}</span>
                            <div className="text-xl sm:text-2xl font-black font-mono text-matcha-light leading-tight">
                              {score.toLocaleString()}
                            </div>
                          </div>
                          <div className="flex items-center space-x-2 text-[10px] text-white/80 font-mono">
                            <span>{t.maxCombo}: <strong className="text-amber-pastel">{maxCombo}x</strong></span>
                            <span>•</span>
                            <span>{t.accuracy}: <strong className="text-white">{hitRate}%</strong></span>
                          </div>
                        </div>
                      </div>

                      {/* 活氧部位統計 */}
                      <div className="mt-2.5 pt-2 border-t border-white/10 grid grid-cols-3 gap-1 text-center text-[10px] text-white/80">
                        <div className="bg-white/5 rounded-lg py-1 px-0.5">
                          <span className="text-matcha-light font-bold">👁️ {t.statEyes}</span>
                          <div className="font-mono text-[11px] text-white font-bold">{gameStats.eyeHits}</div>
                        </div>
                        <div className="bg-white/5 rounded-lg py-1 px-0.5">
                          <span className="text-amber-pastel font-bold">🦒 {t.statNeck}</span>
                          <div className="font-mono text-[11px] text-white font-bold">{gameStats.neckHits}</div>
                        </div>
                        <div className="bg-white/5 rounded-lg py-1 px-0.5">
                          <span className="text-sakura font-bold">🧘 {t.statShoulders}</span>
                          <div className="font-mono text-[11px] text-white font-bold">{gameStats.shoulderHits}</div>
                        </div>
                      </div>
                    </div>

                    {/* 社群裂變與操作按鈕 */}
                    <div className="w-full flex flex-col gap-1.5">
                      <div className="flex gap-2">
                        <button
                          onClick={handleShareResult}
                          className="flex-1 py-2 px-3 rounded-xl bg-gradient-to-r from-amber-pastel to-amber-glow hover:brightness-110 text-slate-dark font-black text-xs shadow-lg flex items-center justify-center space-x-1 transition active:scale-95"
                        >
                          <span>{t.shareBtn}</span>
                        </button>
                        <button
                          onClick={handleDownloadCard}
                          className="py-2 px-3 rounded-xl bg-white/15 hover:bg-white/25 border border-white/20 text-white font-bold text-xs shadow flex items-center justify-center space-x-1 transition active:scale-95 whitespace-nowrap"
                        >
                          <span>{t.saveCardBtn}</span>
                        </button>
                      </div>

                      <div className="flex gap-2">
                        <button
                          onClick={() => beginCalibrationFlow('playing')}
                          className="flex-1 py-1.5 rounded-xl bg-matcha hover:bg-matcha-dark text-white font-black text-xs shadow transition active:scale-95"
                        >
                          {t.retryBtn}
                        </button>
                        <button
                          onClick={() => setGameState('welcome')}
                          className="flex-1 py-1.5 rounded-xl bg-white/15 hover:bg-white/25 text-white font-bold text-xs transition active:scale-95"
                        >
                          {t.homeBtn}
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              );
            })()}

            {/* 複製成功提示 Toast */}
            {showToast && (
              <div className="fixed top-5 left-1/2 transform -translate-x-1/2 bg-slate-dark/95 border border-matcha text-white px-4 py-2 rounded-2xl shadow-2xl text-xs font-bold z-50 animate-bounce flex items-center space-x-2">
                <span>{t.copiedToast}</span>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <DeskBeatApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
